# EGX Seasonality Scanner - started at an exact time by cron-job.org (or by hand).
#
# TIMING: set in cron-job.org (Cairo time zone). It calls GitHub's API, which starts this workflow
#   immediately. Nothing here runs on GitHub's own (imprecise) scheduler.
# SAFETY: a second start on the same Cairo day does nothing (egx_state/last_run.txt), so a retry
#   or double click never sends two emails. Tick "force" on a manual run to override.
# PAUSE: Settings -> Secrets and variables -> Actions -> Variables: EGX_ENABLED = false
# SECRETS: EODHD_API_KEY, SMTP_LOGIN, SMTP_PASSWORD, RECIPIENT_EMAILS (comma-separated)
# RUN NOW: Actions tab -> "EGX daily scanner" -> Run workflow.

name: EGX daily scanner

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if it already ran today"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: egx-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Should it run?
        id: gate
        env:
          ENABLED: ${{ vars.EGX_ENABLED || 'true' }}
          FORCE: ${{ inputs.force }}
        run: |
          today=$(TZ=Africa/Cairo date +%F); now=$(TZ=Africa/Cairo date +%H:%M:%S)
          last=$(cat egx_state/last_run.txt 2>/dev/null || echo none)
          go=false
          if [ "$FORCE" = "true" ]; then go=true
          elif [ "$ENABLED" != "true" ]; then echo "Paused (EGX_ENABLED=$ENABLED)"
          elif [ "$last" = "$today" ]; then echo "Already ran today ($today)"
          else go=true; fi
          echo "Started $today $now Cairo -> run: $go"
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "today=$today" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/egx_daily.yml

      - name: Install packages
        if: steps.gate.outputs.go == 'true'
        run: pip install requests pandas numpy matplotlib

      - name: Run the scanner
        if: steps.gate.outputs.go == 'true'
        working-directory: egx_state
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          SMTP_LOGIN: ${{ secrets.SMTP_LOGIN }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        run: python ../egx_seasonality_scanner.py

      - name: Save the scanner's memory
        if: steps.gate.outputs.go == 'true'
        run: |
          echo "${{ steps.gate.outputs.today }}" > egx_state/last_run.txt
          git config user.name "egx-scanner-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add egx_state
          git diff --cached --quiet && exit 0
          git commit -m "EGX scanner state ${{ steps.gate.outputs.today }} [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

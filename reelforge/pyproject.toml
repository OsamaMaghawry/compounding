[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelforge"
version = "0.2.0"
description = "Local AI auto-editor for vertical short-form video, with accurate Arabic captions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0.0"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]

[project.scripts]
reelforge = "reelforge.cli:main"

[tool.setuptools]
packages = ["reelforge"]
# profiles/ and assets/ live beside the package and are read from the checkout,
# so install in editable mode: pip install -e .

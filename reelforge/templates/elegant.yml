name: elegant
description: El Messiri, full lines, soft blur transitions. For storytelling and long-form cutdowns.
captions:
  style: plain
  font: El Messiri
  font_size: 80
  max_words: 6
  max_chars: 44
  emphasis_color: "#E8C48A"
cuts:
  min_silence: 0.55
  pad_before: 0.16
  pad_after: 0.2
zoom:
  levels: 2
  max_consecutive: 1
  drift_beat: 1.1
  punch_time: 0.6
  release_time: 1.2
  rate_per_min: 6.0
  max_factor: 1.1
  min_gap: 2.8
transitions:
  kind: blur
  strength: 0.5
  max_per_min: 8.0
